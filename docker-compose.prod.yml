services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rh_control}
      POSTGRES_USER: ${POSTGRES_USER:-rh_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_control} -d ${POSTGRES_DB:-rh_control}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rh_control}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rh_control}
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY no .env.production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${APP_URL:-http://localhost}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https?://.*}
      ATESTADOS_UPLOADS_DIR: /app/uploads/atestados
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
